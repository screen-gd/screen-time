<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; script-src 'self'">
  <title>Focus lockdown</title>
  <link rel="stylesheet" href="app.css">
</head>
<body class="cover">
  <main class="cover-card slab" role="alert">
    <span class="tile tile-brand"><svg class="mark" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true">
      <rect x="3.2" y="7" width="9.6" height="6.6" rx="1.4"/><path d="M5.4 7V5.2a2.6 2.6 0 0 1 5.2 0V7"/>
    </svg></span>
    <h1>Focus lockdown is on</h1>
    <p class="cover-site num" id="site"></p>
    <p class="cover-why">This site is on your block list. Close the tab or switch to something else and this screen goes away.</p>
    <button class="btn" type="button" id="open-app">Open screen-time</button>
  </main>
  <script src="focus.js"></script>
</body>
</html>
