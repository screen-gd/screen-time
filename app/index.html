<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; script-src 'self'; connect-src 'self' http://127.0.0.1:* http://localhost:*">
  <title>Tally - Screen time</title>
  <link rel="stylesheet" href="dither.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="window">
    <aside class="rail" aria-label="Tally">
      <div class="brand">
        <span class="tile tile-brand"><svg class="mark" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
          <path d="M8.6 6.5v19M13.4 6.5v19M18.2 6.5v19M23 6.5v19M6.2 23.2 25.4 9.2"/>
        </svg></span>
        <div>
          <div class="brand-name">Tally</div>
          <div class="brand-scope">Local only</div>
        </div>
      </div>

      <nav class="nav" aria-label="Screens">
        <a class="nav-item" href="#/today" data-nav="today">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.6"/><path d="M8 4.9V8l2.1 1.3"/></svg>
          <span>Today</span>
        </a>
        <a class="nav-item" href="#/apps" data-nav="apps">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.2" y="2.2" width="4.6" height="4.6" rx="1.2"/><rect x="9.2" y="2.2" width="4.6" height="4.6" rx="1.2"/><rect x="2.2" y="9.2" width="4.6" height="4.6" rx="1.2"/><rect x="9.2" y="9.2" width="4.6" height="4.6" rx="1.2"/></svg>
          <span>Apps</span>
        </a>
        <a class="nav-item" href="#/sites" data-nav="sites">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.6"/><path d="M2.6 8h10.8M8 2.4c1.5 1.5 2.2 3.4 2.2 5.6S9.5 12.1 8 13.6C6.5 12.1 5.8 10.2 5.8 8S6.5 3.9 8 2.4Z"/></svg>
          <span>Websites</span>
        </a>
        <a class="nav-item" href="#/settings" data-nav="settings">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 5h5M10.8 5h2.7M2.5 11h2.7M8.5 11h5"/><circle cx="9.2" cy="5" r="1.5"/><circle cx="6.9" cy="11" r="1.5"/></svg>
          <span>Settings</span>
        </a>
      </nav>

      <div class="rail-foot">
        <div id="rail-state"></div>
        <div id="preview-note" hidden>Sample data · preview</div>
      </div>
    </aside>

    <main class="page" id="view" tabindex="-1"></main>
  </div>

  <dialog class="dialog" id="confirm-dialog">
    <form method="dialog">
      <h2>Delete all recorded time?</h2>
      <p>Every app and website total Tally has stored on this computer will be removed. This cannot be undone.</p>
      <div class="dialog-actions">
        <button class="btn btn-secondary" value="cancel">Keep data</button>
        <button class="btn btn-danger" value="delete">Delete data</button>
      </div>
    </form>
  </dialog>

  <script src="demo-data.js"></script>
  <script src="web-api.js"></script>
  <script src="app.js"></script>
</body>
</html>
